<!DOCTYPE html>
<head>
    <style>
        @keyframes indeterminate-bar {
            0% { left: 0%; width: 0; }
            50% { left: 0%; width: 100%; }
            100% { left: 100%; width: 0; }
        }
        .progress-container {
            position: relative;
            width: 300px;
            height: 4px;
            margin-top: 40px;
            background-color: rgba(13, 193, 233, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background-color: #0DC1E9;
            animation: indeterminate-bar 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        #status { color:#aaa; margin-top:22px; font-size:22px; font-family:Roboto,Arial,sans-serif; }
    </style>
    <script>
        "use strict";

        // Samsung TV browser user agent, applied to the whole webview the way
        // platform browser settings do it (tizen.websetting.setUserAgentString). It runs here,
        // on the first page, before anything navigates to YouTube, so the HTML,
        // scripts and API requests all carry it. No settings UI.
        var DEFAULT_USER_AGENT = "Mozilla/5.0 (SMART-TV; LINUX; Tizen 4.0) AppleWebKit/537.3 (KHTML, like Gecko) SamsungBrowser/2.1 TV Safari/537.3";
        try {
            if (window.tizen && tizen.websetting && typeof tizen.websetting.setUserAgentString === "function") {
                tizen.websetting.setUserAgentString(DEFAULT_USER_AGENT);
            } else {
                console.warn("tizen.websetting unavailable; user agent not changed");
            }
        } catch (e) {
            console.warn("Could not set user agent: " + e.message);
        }

        function safeRegisterKey(key) {
            try {
                if (window.tizen && tizen.tvinputdevice && typeof tizen.tvinputdevice.registerKey === "function") {
                    tizen.tvinputdevice.registerKey(key);
                }
            } catch (e) {
                console.warn("Could not register key " + key + ": " + e.message);
            }
        }

        [
            "ColorF0Red", "ColorF1Green", "ColorF2Yellow", "ColorF3Blue",
            "MediaPlayPause", "MediaPlay", "MediaPause", "MediaStop",
            "MediaFastForward", "MediaRewind", "MediaTrackNext", "MediaTrackPrevious"
        ].forEach(safeRegisterKey);

        function getCastArgs() {
            try {
                var data = tizen.application.getCurrentApplication().getRequestedAppControl().appControl.data;
                if (!data || !data[0] || !data[0].value || !data[0].value[0]) return "";
                var parsedData = JSON.parse(data[0].value[0]);
                return typeof parsedData.args === "string" ? parsedData.args : "";
            } catch (e) {
                return "";
            }
        }

        function sanitizeCastArgs(raw) {
            var input = String(raw || "").replace(/^[?&]+/, "");
            if (!input) return "";
            var out = [];
            input.split("&").forEach(function (part) {
                if (!part) return;
                var eq = part.indexOf("=");
                var key = eq === -1 ? part : part.slice(0, eq);
                var value = eq === -1 ? "" : part.slice(eq + 1);
                try { key = decodeURIComponent(key.replace(/\+/g, " ")); } catch (e) {}
                try { value = decodeURIComponent(value.replace(/\+/g, " ")); } catch (e) {}
                if (!/^[A-Za-z0-9_.-]{1,64}$/.test(key)) return;
                out.push(encodeURIComponent(key) + "=" + encodeURIComponent(value));
            });
            return out.join("&");
        }

        // The proxy's pages are on 127.0.0.1 (the service listens there only). The
        // page itself is opened as localhost, the address YouTube's links expect.
        var PROXY_URL = "http://localhost:8081";
        var HEALTH_URL = "http://127.0.0.1:8081/axotube/health";
        var LAUNCH_NEXT_URL = "http://127.0.0.1:8081/axotube/launch/next";
        var DIAGNOSTICS_URL = "http://127.0.0.1:8081/axotube/diagnostics";
        var DIAL_URL = "http%3A%2F%2Flocalhost%3A8080%2Fdial%2Fapps%2FYouTube";
        var HEALTH_REQUEST_TIMEOUT_MS = 2000;
        var LAUNCH_RETRY_LIMIT = 3;
        var LAUNCH_MAX_POLLS = 200; // covers the debugger path (SDB 20 s, attach 15 s); the proxy path answers at once
        var SLOW_START_ATTEMPT = 40;
        var MAX_HEALTH_ATTEMPTS = 600;
        var VERSION_NOTICE_MS = 3000;
        var DEBUGGER_NOTICE_MS = 2500;
        var KEY_ENTER = 13;
        var KEY_RED = 403;
        var launchFailures = 0;
        var healthAttempts = 0;
        var launchPolls = 0;
        var retryReady = false;

        function setStatus(text) {
            var el = document.getElementById("status");
            if (el) el.textContent = text;
        }

        function wgtVersion() {
            try {
                return String(tizen.application.getCurrentApplication().appInfo.version || "");
            } catch (e) {
                return "";
            }
        }

        function fetchWithDeadline(url, options, timeoutMs) {
            return new Promise(function (resolve, reject) {
                var settled = false;
                var timeoutId = setTimeout(function () {
                    if (settled) return;
                    settled = true;
                    reject(new Error("Request timed out"));
                }, timeoutMs);

                fetch(url, options).then(function (response) {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timeoutId);
                    resolve(response);
                }, function (error) {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timeoutId);
                    reject(error);
                });
            });
        }

        // Polls quickly at first, then backs off. The bound is generous (about
        // ten minutes) so a slow TV keeps the status line updated and recovers
        // as soon as the service answers.
        function healthDelayMs() {
            return healthAttempts < 20 ? 300 : 1000;
        }

        // The service stopped answering or failed to start. Enter retries, and the
        // red key opens the diagnostics page.
        function showRetry(message) {
            retryReady = true;
            setStatus(message + " Press Enter to retry. Red for diagnostics.");
        }

        function retry() {
            retryReady = false;
            healthAttempts = 0;
            launchFailures = 0;
            launchPolls = 0;
            launchService();
        }

        // True when version a is older than b (dotted numbers, missing parts are 0).
        function isOlder(a, b) {
            var pa = String(a).split(".");
            var pb = String(b).split(".");
            for (var i = 0; i < 3; i++) {
                var x = parseInt(pa[i], 10) || 0;
                var y = parseInt(pb[i], 10) || 0;
                if (x !== y) return x < y;
            }
            return false;
        }

        // An older service than the app means the app was installed over a newer
        // service and the two can disagree. The service also updates itself, so a
        // newer service is normal and gets no warning.
        function checkVersions(serviceVersion, next) {
            var app = wgtVersion();
            if (app && serviceVersion && serviceVersion !== "unknown" && isOlder(serviceVersion, app)) {
                setStatus("Service " + serviceVersion + " is older than the app " + app + ". Reinstall the app.");
                setTimeout(next, VERSION_NOTICE_MS);
            } else {
                next();
            }
        }

        function openYouTube() {
            var args = sanitizeCastArgs(getCastArgs());
            var target = PROXY_URL + "/tv?additionalDataUrl=" + DIAL_URL + (args ? "&" + args : "");
            healthAttempts += 1;
            if (healthAttempts > MAX_HEALTH_ATTEMPTS) {
                showRetry("Service did not respond.");
                return;
            }
            setStatus(
                healthAttempts < SLOW_START_ATTEMPT
                    ? "Starting axotube service… (" + healthAttempts + ")"
                    : "Service is slow to start. Still waiting… (" + healthAttempts + ")"
            );
            fetchWithDeadline(HEALTH_URL, { cache: "no-store" }, HEALTH_REQUEST_TIMEOUT_MS)
                .then(function (r) {
                    if (!r.ok) return null;
                    return r.json().catch(function () { return {}; });
                })
                .then(function (health) {
                    if (!health) {
                        setTimeout(openYouTube, healthDelayMs());
                        return;
                    }
                    setStatus("Service running. Opening YouTube…");
                    checkVersions(health.version, function () { handOff(target); });
                })
                .catch(function () {
                    setTimeout(openYouTube, healthDelayMs());
                });
        }

        // Asks the service how to open YouTube. Proxy is the default: the answer is
        // "proxy" and the WGT loads the proxy page at once. Only when the user turns
        // the debugger launch on does the service answer "exit" (this WGT closes so
        // the service can start it under the debugger), "wait" (keep asking) or
        // "attached" (the service is navigating this WGT).
        function handOff(fallbackUrl) {
            var args = sanitizeCastArgs(getCastArgs());
            launchPolls += 1;
            if (launchPolls > LAUNCH_MAX_POLLS) {
                location.href = fallbackUrl;
                return;
            }
            fetchWithDeadline(LAUNCH_NEXT_URL + "?args=" + encodeURIComponent(args), { cache: "no-store" }, HEALTH_REQUEST_TIMEOUT_MS)
                .then(function (r) { return r.json(); })
                .then(function (state) {
                    if (state.action === "exit") {
                        setStatus("Restarting under the debugger…");
                        try {
                            tizen.application.getCurrentApplication().exit();
                        } catch (e) {
                            location.href = fallbackUrl;
                        }
                    } else if (state.action === "wait") {
                        setStatus("Connecting to YouTube…");
                        setTimeout(function () { handOff(fallbackUrl); }, 250);
                    } else if (state.action === "attached") {
                        setStatus("Opening YouTube…");
                    } else {
                        goToProxy(fallbackUrl, state);
                    }
                })
                .catch(function () {
                    location.href = fallbackUrl;
                });
        }

        // When the debugger was asked for and could not be used, the reason is shown
        // briefly, so the user knows why YouTube opened without it.
        function goToProxy(fallbackUrl, state) {
            if (state.mode === "debugger" && state.reason) {
                setStatus("Opening YouTube without the debugger. " + state.reason);
                setTimeout(function () { location.href = fallbackUrl; }, DEBUGGER_NOTICE_MS);
            } else {
                location.href = fallbackUrl;
            }
        }

        function launchService() {
            setStatus("Launching axotube service…");
            try {
                var pkgId = tizen.application.getCurrentApplication().appInfo.packageId;
                var serviceId = pkgId + ".StandaloneService";
                tizen.application.launchAppControl(
                    new tizen.ApplicationControl("http://tizen.org/appcontrol/operation/service"),
                    serviceId,
                    function () {
                        setStatus("Service launched. Waiting for it to respond…");
                        openYouTube();
                    },
                    function (e) {
                        launchFailures += 1;
                        var reason = e && e.message ? e.message : e;
                        if (launchFailures < LAUNCH_RETRY_LIMIT) {
                            setStatus("Service launch failed (" + reason + "). Retrying…");
                            setTimeout(launchService, 2000);
                        } else {
                            showRetry("Service launch failed (" + reason + ").");
                        }
                    }
                );
            } catch (e) {
                showRetry("Launch Service failed: " + e.message + ".");
            }
        }

        document.addEventListener("keydown", function (e) {
            if (e.keyCode === KEY_RED || e.key === "ColorF0Red") {
                location.href = DIAGNOSTICS_URL + "?wgt=" + encodeURIComponent(wgtVersion());
            } else if ((e.keyCode === KEY_ENTER || e.key === "Enter") && retryReady) {
                retry();
            }
        });

        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", launchService);
        else launchService();
    </script>
</head>
<body style="background-color: #0f0f0f; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <h1 style="color: #FFFFFF; font-size: 80px; font-family: Roboto,Noto Sans CJK ZH-HK,Noto Sans Thai,Arial,Helvetica,sans-serif; margin: 0;">axotube</h1>
    <div class="progress-container"><div class="progress-bar"></div></div>
    <div id="status">Starting…</div>
</body>
</html>
