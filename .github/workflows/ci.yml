name: CI

on:
  push:
    branches:
      - main
      - fix/**
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mods/package-lock.json
            service/package-lock.json
      - name: Install mods dependencies
        run: npm ci --prefix mods
      - name: Install service dependencies
        run: npm ci --prefix service
      - name: Run regression tests
        run: npm test
      - name: Build mods and service
        run: npm run build
      - name: Build standalone bundle from fresh artifacts
        run: node scripts/build-standalone.js
      - name: Upload fresh distributables
        uses: actions/upload-artifact@v4
        with:
          name: axotube-built-artifacts
          path: |
            dist
            standalone/userscript/userScript.js
            standalone/service/dist/index.js
            standalone/service/package-lock.json
      - name: Sync green release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/deep-dive-regressions'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/userScript.js dist/service.js standalone/service/package-lock.json
          if git diff --cached --quiet; then
            echo "Generated artifacts already synchronized."
          else
            git commit -m "build: sync 1.20.1 distributables"
            git push origin HEAD:fix/deep-dive-regressions
          fi
